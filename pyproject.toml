[project]
name = "prime-logistics"
version = "1.3.5"
description = "Autonomous Topology and Multimodal Discovery Engine"
requires-python = ">=3.14,<4.0"
dependencies = [
    "duckdb==1.4.4",
    "fastapi==0.135.1",
    "h3==4.4.2",
    "numpy==2.4.2",
    "ortools==9.15.6755",
    "pandas==3.0.1",
    "pyarrow>=23.0.1",
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",
    "pyyaml>=6.0.3",
    "rustworkx==0.17.1",
    "scipy==1.17.1",
    "slowapi>=0.1.9",
    "uvicorn==0.41.0",
    "pyjwt (>=2.8.0)",
    "orjson>=3.9.0",
]

[tool.pyright]
pythonVersion = "3.14"
extraPaths = ["src"]
include = ["src", "main.py", "scripts"]
typeCheckingMode = "basic"
reportMissingModuleSource = false

[tool.mypy]
mypy_path = "src"
python_version = "3.14"
ignore_missing_imports = true
warn_unused_imports = true
warn_unused_configs = true


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "psutil==7.2.2",
    "pytest==9.0.2",
    "requests==2.32.5",
]
