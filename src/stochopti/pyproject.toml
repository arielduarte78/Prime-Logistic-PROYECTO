[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stochopti"
version = "0.1.0"
description = "Stochastic Multi-Objective Optimization Engine on Graphs"
readme = "README.md"
authors = [
    { name = "Prime Logistics Algorithms", email = "algo@prime.invalid" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "rustworkx>=0.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0"
]
