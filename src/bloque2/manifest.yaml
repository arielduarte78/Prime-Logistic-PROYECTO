    metric_impacts:
      - metric: T
        base_multiplier: 1.2
        stress_scaling: gamma

  - code: FALLA_MECANICA
    level: MICRO
    description: "Falla mecánica de unidad en ruta"
    p_base: 0.12
    distribution: { type: EVT, parameters: {} }
    stress_weight: 0.8
    conditioners: []
