meta:
  schema_version: "2.0"
  description: "Manifiesto calibrado para red vial AMBA — OSM IDs"
  geographic_context: "AMBA — Buenos Aires"

global_parameters:
  stress_index: baseline
  alpha: 0.15
  beta: 0.35
  gamma: 0.25
  severity_weights_range: [0.5, 2.0]
  outlier_cap:
    type: hard
    max_multiplier: 5.0
  convergence:
    window_iterations: 100
    epsilon: 1e-6
  impact_combination_rules:
    - multiplicativity
    - adjacency_precedence
    - capacity_preservation

event_levels:
  SYSTEMIC:
    description: "Eventos de alcance regional AMBA"
    frequency_profile: "very_low"
    typical_impact_scope: "global"
    allowed_target_types: [NETWORK, ZONE, ARC, NODE]
  TACTICAL:
    description: "Eventos zonales o sectoriales"
    frequency_profile: "low"
    typical_impact_scope: "regional"
    allowed_target_types: [NODE, ARC, ZONE, NETWORK]
  MICRO:
    description: "Eventos operativos cotidianos"
    frequency_profile: "high"
    typical_impact_scope: "local"
    allowed_target_types: [UNIT, NODE, ARC, NETWORK]

events:
  # ===== SYSTEMIC =====
  - code: PARO_NACIONAL_TRANSPORTE
    level: SYSTEMIC
    description: "Paro nacional de transporte — red completa inactiva"
    p_base: 0.002
    distribution: { type: EVT, parameters: {} }
    stress_weight: 1.5
    conditioners: []
    target: { type: NETWORK, selector: "ALL" }
    structural_effects:
      adjacency: { action: DISABLE }
      capacity: { modifier: 0.0 }
      demand: { modifier: 1.0 }
    metric_impacts:
      - metric: C
        base_multiplier: 1.0
        stress_scaling: alpha

  - code: CRISIS_COMBUSTIBLE
    level: SYSTEMIC
    description: "Crisis de combustible — costos se duplican en toda la red"
    p_base: 0.008
    distribution: { type: EVT, parameters: {} }
    stress_weight: 1.4
    conditioners: []
    target: { type: NETWORK, selector: "ALL" }
    structural_effects:
      adjacency: { action: NONE }
      capacity: { modifier: 0.8 }
      demand: { modifier: 1.0 }
    metric_impacts:
      - metric: C
        base_multiplier: 2.0
        stress_scaling: beta
      - metric: T
        base_multiplier: 1.2
        stress_scaling: gamma

  - code: INUNDACION_CONURBANO
    level: SYSTEMIC
    description: "Inundación regional — capacidad reducida en toda la red"
    p_base: 0.015
    distribution: { type: EVT, parameters: {} }
    stress_weight: 1.3
    conditioners: []
    target: { type: NETWORK, selector: "ALL" }
    structural_effects:
      adjacency: { action: NONE }
      capacity: { modifier: 0.7 }
      demand: { modifier: 1.2 }
    metric_impacts:
      - metric: T
        base_multiplier: 1.5
        stress_scaling: gamma

  # ===== TACTICAL =====
  - code: CORTE_ACCESO_NORTE
    level: TACTICAL
    description: "Corte en zona norte AMBA — Panamericana y accesos"
    p_base: 0.04
    distribution: { type: LOGNORMAL, parameters: {} }
    stress_weight: 1.2
    conditioners:
      - event: INUNDACION_CONURBANO
        multiplier: 3.0
        scope: probability
    target: { type: NETWORK, selector: "ALL" }
    structural_effects:
      adjacency: { action: NONE }
      capacity: { modifier: 0.6 }
      demand: { modifier: 1.0 }
    metric_impacts:
      - metric: T
        base_multiplier: 1.8
        stress_scaling: gamma

  - code: CORTE_ACCESO_OESTE
    level: TACTICAL
    description: "Corte en zona oeste AMBA — Acceso Oeste y ramales"
    p_base: 0.04
    distribution: { type: LOGNORMAL, parameters: {} }
    stress_weight: 1.2
    conditioners:
      - event: INUNDACION_CONURBANO
        multiplier: 3.0
        scope: probability
    target: { type: NETWORK, selector: "ALL" }
    structural_effects:
      adjacency: { action: NONE }
      capacity: { modifier: 0.6 }
      demand: { modifier: 1.0 }
    metric_impacts:
      - metric: T
        base_multiplier: 1.8
        stress_scaling: gamma

  - code: CORTE_ACCESO_SUR
    level: TACTICAL
    description: "Corte en zona sur AMBA — Riccheri y autopista La Plata"
    p_base: 0.04
    distribution: { type: LOGNORMAL, parameters: {} }
    stress_weight: 1.2
    conditioners:
      - event: INUNDACION_CONURBANO
        multiplier: 3.0
        scope: probability
    target: { type: NETWORK, selector: "ALL" }
    structural_effects:
      adjacency: { action: NONE }
      capacity: { modifier: 0.6 }
      demand: { modifier: 1.0 }
    metric_impacts:
      - metric: T
        base_multiplier: 1.8
        stress_scaling: gamma

  - code: HUELGA_TRANSPORTE_ZONA
    level: TACTICAL
    description: "Huelga de transporte zonal"
    p_base: 0.03
    distribution: { type: LOGNORMAL, parameters: {} }
    stress_weight: 1.1
    conditioners:
      - event: PARO_NACIONAL_TRANSPORTE
        multiplier: 8.0
        scope: probability
    target: { type: NETWORK, selector: "ALL" }
    structural_effects:
      adjacency: { action: NONE }
      capacity: { modifier: 0.5 }
      demand: { modifier: 1.0 }
    metric_impacts:
      - metric: T
        base_multiplier: 1.3
        stress_scaling: gamma

  # ===== MICRO =====
  - code: CONGESTION_PICO_MANANA
    level: MICRO
    description: "Congestión hora pico mañana — velocidad reducida red completa"
    p_base: 0.45
    distribution: { type: LOGNORMAL, parameters: {} }
    stress_weight: 0.6
    conditioners: []
    target: { type: NETWORK, selector: "ALL" }
    structural_effects:
      adjacency: { action: NONE }
      capacity: { modifier: 0.95 }
      demand: { modifier: 1.0 }
